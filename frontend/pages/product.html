<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DeKUT Nexus | Product</title>

    <script>
        (function () {
            try {
                var s = JSON.parse(localStorage.getItem("dekutSettings") || "{}");
                document.documentElement.setAttribute("data-theme", s.darkMode ? "dark" : "light");
            } catch (e) {}
        })();
    </script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header class="main-header">

        <div class="left-header">

            <button class="menu-btn">

                <i class="fa-solid fa-bars"></i>

                Menu

            </button>

        </div>

        <div class="center-header">

            <div>

                <h1>DeKUT Nexus</h1>

                <p>Innovation • Enterprise • Community</p>

            </div>

        </div>

        <div class="right-header">

            <button class="signin-btn">

                <i class="fa-solid fa-user"></i>

                Sign In

            </button>

            <button class="cart-btn">

                <i class="fa-solid fa-cart-shopping"></i>

                Cart

                <span class="cart-count">0</span>

            </button>

        </div>

    </header>

    <main class="product-page">

        <div class="product-breadcrumb">

            <a href="../index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                Home
            </a>

            <span id="breadcrumbCategory"></span>

        </div>

        <!-- Populated by js/products.js -->
        <div id="productDetail" class="product-detail">
            <p class="product-loading">Loading product…</p>
        </div>

        <section class="related-products">

            <h2>You May Also Like</h2>

            <div id="relatedProducts" class="product-grid"></div>

        </section>

    </main>

    <script src="../js/products-data.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/products.js"></script>

</body>

</html>
