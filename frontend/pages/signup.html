<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <link rel ="icon" href="assets/nova_logo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    
    
</head>

<body>

    <header class="main-header"></header>

    <div class="form-container">
        <form class="registration-form" action="http://localhost/online_store/register.php" method="POST">
            
            <div class="logo">
                <img src="assets/nova_logo.png" alt="novaLogo" class="logo">
            </div>

            <h2>Welcome to Nova Mart</h2>

            <label for="name">Full Name</label>
            <input type="text" name="name" id="name" placeholder="Your Name" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter password" required>

            <label for="phone">Phone</label>
            <input type="tel" name="phone" id="phone" placeholder="0712345678" required>

            <label for="address">Address</label>
            <input type="text" name="address" id="address" placeholder="Your address" required>

            <input type="submit" value="Register">
            <a href ="login.html">Already have an account? Login here</a>
        </form>
    </div>

</body>
</html>
