<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

  
<body>

  <div class="login">
<img src="assets/nova_logo.png" alt="novaLogo" class="logo">

    <h2>welcome </h2>

    <p>
      Don't have an account?
      <a href="register.html">Register here</a>
    </p>

    
    <form action="http://localhost/online_store/register.php" method="POST" class="login-form">

      <label for="email">Email</label>
      <input type="email"
             class="login-form-input"
             name="email"
             id="email"
             placeholder="enter your email"
             required>

             <label for="password">Password</label>
             <input type="password"
                    class="login-form-input"
                    name="password"
                    id="password"
                    placeholder="enter your password"
                    required>

      <label for="submit">submit</label>
      <input type="submit" value="Login"
       class="login-form-submit">
      <p>forgot password? <a href="forgot_password.html">Reset password</a></p>
             

      <p class="message">
        
        Please check back later for updates. Thank you for your patience.
      </p>

    </form>

    <footer>
      <p>&copy; 2024 Nova Mart. All rights reserved.</p>
    </footer>

  </div>

</body>
</html>
